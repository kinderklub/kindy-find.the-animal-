    function renderAnimalVisual(animal, isSmallChoice = false) {
      const altText = currentLang === "bm" ? animal.name_bm : animal.name_en;
      if (animal.imageUrl) {
        return `
          <img src="${animal.imageUrl}" 
               alt="${altText}" 
               referrerpolicy="no-referrer"
               loading="eager"
               class="photo-display w-full h-full object-cover shadow-sm ${isSmallChoice ? 'rounded-xl max-h-24 sm:max-h-28' : 'rounded-2xl'}" 
               onerror="this.outerHTML = \`${animal.render().replace(/"/g, '&quot;')}\`">
        `;
      }
      return animal.render();
    }
